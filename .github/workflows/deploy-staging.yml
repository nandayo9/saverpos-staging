name: Deploy staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through cPanel UAPI
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        run: |
          set -eu
          test -n "$CPANEL_HOST"
          test -n "$CPANEL_USERNAME"
          test -n "$CPANEL_API_TOKEN"
          test -n "$CPANEL_REPOSITORY_ROOT"
          update_response="$(curl --fail --silent --show-error \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get "https://${CPANEL_HOST}:2083/execute/VersionControl/update" \
            --data-urlencode "repository_root=${CPANEL_REPOSITORY_ROOT}" \
            --data-urlencode "branch=staging")"
          printf '%s\n' "$update_response" | jq -e \
            '.result.status == 1 and (.result.errors == null or (.result.errors | length == 0))' >/dev/null

          deploy_response="$(curl --fail --silent --show-error \
            -H "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=${CPANEL_REPOSITORY_ROOT}")"
          printf '%s\n' "$deploy_response" | jq -e \
            '.result.status == 1 and (.result.errors == null or (.result.errors | length == 0))' >/dev/null
